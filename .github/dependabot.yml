version: 2
updates:
  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "Beso1227"
    labels:
      - "dependencies"
      - "area/ci"
    commit-message:
      prefix: "ci"
      include: "scope"

  # Maintain NuGet package dependencies for .NET projects
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "Beso1227"
    labels:
      - "dependencies"
      - "area/build"
    commit-message:
      prefix: "chore"
      include: "scope"
