# GitHub Repository Settings as Code
# Used for repo configuration and automated label & branch governance.

repository:
  name: Deltempo
  description: "High-performance, zero-telemetry Windows cache cleaner and memory optimizer with GUI & CLI."
  homepage: https://beso1227.github.io/Deltempo/
  topics:
    - windows
    - wpf
    - dotnet
    - cleaner
    - disk-cleanup
    - memory-optimizer
    - zero-telemetry
    - csharp
    - cli
    - desktop-app

  has_issues: true
  has_projects: false
  has_wiki: false
  has_downloads: true

  # Pull Request merge configurations
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: true
  delete_branch_on_merge: true
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY

# Branch protection configuration for main branch
branches:
  - name: main
    protection:
      required_pull_request_reviews:
        dismiss_stale_reviews: true
        require_code_owner_reviews: true
        required_approving_review_count: 1
      required_status_checks:
        strict: true
        contexts:
          - "Build, Test & Quality Gate"
          - "CodeQL"
      enforce_admins: false
      allow_force_pushes: false
      allow_deletions: false

# Standardized GitHub Label Taxonomy
labels:
  # Type
  - name: "type/bug"
    color: "d73a4a"
    description: "Something is not working properly"
  - name: "type/feature"
    color: "a2eeef"
    description: "New feature or functional enhancement"
  - name: "type/enhancement"
    color: "0075ca"
    description: "Incremental improvement to existing functionality"
  - name: "type/performance"
    color: "e99695"
    description: "Performance, memory, or throughput improvements"
  - name: "type/security"
    color: "b60205"
    description: "Security vulnerability, hardening, or advisory"
  - name: "type/documentation"
    color: "0075ca"
    description: "Improvements or additions to documentation"
  - name: "type/refactor"
    color: "cfd3d7"
    description: "Code restructuring without behavior changes"

  # Area
  - name: "area/core"
    color: "5319e7"
    description: "Deltempo.Core library and shared engines"
  - name: "area/ui"
    color: "1d76db"
    description: "WPF GUI, views, themes, and interactions"
  - name: "area/cli"
    color: "0e8a16"
    description: "Deltempo.Cli console executable and commands"
  - name: "area/safety"
    color: "e11d48"
    description: "Safety invariants, root containment, and path protection"
  - name: "area/cleaning"
    color: "f9d0c4"
    description: "Scanner, cleaner rules, and cache purging logic"
  - name: "area/ci"
    color: "fbca04"
    description: "GitHub Actions workflows and automation"
  - name: "area/build"
    color: "c2e0c6"
    description: "MSBuild, csproj, packages, and publishing"

  # Priority
  - name: "priority/critical"
    color: "b60205"
    description: "Highest priority - requires urgent resolution"
  - name: "priority/high"
    color: "d93f0b"
    description: "High priority task or defect"
  - name: "priority/medium"
    color: "fbca04"
    description: "Standard priority"
  - name: "priority/low"
    color: "0e8a16"
    description: "Low priority, nice to have"

  # Status & Community
  - name: "status/in-progress"
    color: "ededed"
    description: "Actively being worked on"
  - name: "status/needs-reproduction"
    color: "d4c5f9"
    description: "More info or reproduction steps needed"
  - name: "status/blocked"
    color: "000000"
    description: "Blocked by external dependency or upstream issue"
  - name: "good first issue"
    color: "7057ff"
    description: "Good for newcomers and first-time contributors"
  - name: "help wanted"
    color: "008672"
    description: "Extra attention or community contribution needed"
  - name: "dependencies"
    color: "0366d6"
    description: "Automated dependency updates from Dependabot"
