# GitHub Repository Settings as Code
# Applied by .github/workflows/apply-repo-settings.yml (manual dispatch, or push on
# changes to this file). This file is the DECLARED state; GitHub is the enforced
# state. Verify reality with:
#   gh api repos/Beso1227/Deltempo --jq '.description, .has_wiki, .has_discussions'
#   gh label list
# If the two disagree, this file is wrong and this file is what should change.

repository:
  name: Deltempo
  description: "Deltempo: Free, open-source disk cleaner & RAM optimizer for Windows 11/10 - a zero-telemetry CCleaner alternative. Reclaim 10-40+ GB from temp files, AppData junk & GPU shader caches. Deep uninstaller, duplicate finder, treemap disk analyzer. No install, GUI + CLI."
  homepage: https://beso1227.github.io/Deltempo/
  topics:
    - ccleaner-alternative
    - disk-analyzer
    - disk-cleaner
    - disk-cleanup
    - disk-space
    - disk-space-analyzer
    - disk-usage
    - duplicate-finder
    - junk-file-cleaner
    - memory-cleaner
    - memory-optimizer
    - portable-app
    - privacy
    - ram-cleaner
    - treemap
    - uninstaller
    - windows-11
    - windows-cleaner
    - windows-optimizer
    - zero-telemetry

  has_issues: true
  has_projects: true
  has_wiki: true
  has_downloads: false
  # Discussions is the natural home for usage questions. It is currently OFF in the
  # live repository. Turning it on is a deliberate choice, not an oversight - see
  # the "Known divergences" note at the bottom of this file.
  has_discussions: false

  # Pull Request merge configurations
  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: true
  delete_branch_on_merge: false
  squash_merge_commit_title: COMMIT_OR_PR_TITLE
  squash_merge_commit_message: COMMIT_MESSAGES

# Branch protection configuration for main branch
#
# KNOWN DIVERGENCE - read before trusting this block.
#
# Two declarations are still NOT applied live:
#
#   1. Nobody is required to review any PR. CODEOWNERS is INERT - it only has effect
#      when branch protection requires a code-owner review. It is currently advisory.
#   2. "CodeQL" is not a required check, so a PR can merge with CodeQL red.
#
# Both are listed in known_divergences below, so the verifier reports them as
# recorded gaps instead of failing on them. Applying the review requirement is not
# currently possible in practice either: this project has exactly one maintainer and
# GitHub does not let you approve your own PR, so require_code_owner_reviews would
# block the maintainer from merging. The realistic options are to require the CodeQL
# status check only, or to find a second maintainer. Do not flip the review block on
# without deciding that.
#
# CLOSED on 2026-10-22: enforce_admins.
# It was FALSE, which is what ALLOWED a broken main: on 2026-10-17 PR #19 (11,381
# additions across 73 files) merged with "Build, Test & Quality Gate" RED, and the
# push that landed it was also red - run 39035500169 on 30a77aa. The check did its
# job; it was simply not applied to the account that pushed.
#
# Evidence that this was the actual hole, from pushing 7ea0461 to main while the
# setting was still false:
#   remote: Bypassed rule violations for refs/heads/main:
#   remote: - Required status check "Build, Test & Quality Gate" is expected.
# The rule existed and was enforceable for everyone except the administrator.
#
# Consequence, deliberately accepted: the maintainer can no longer push an untested
# commit straight to main. Status checks are recorded per commit SHA, so the
# workflow becomes: push a branch, let CI run on it, then merge the PR - or push
# that already-green SHA.
#
# Not everything here is verifiable from CI, and the verifier says so instead of
# guessing. The workflow token has no Administration scope on github.com, so the
# Apply Repository Settings job cannot read branch protection at all, and GitHub
# omits the merge/squash settings from the repository payload it can read. Those
# fields are reported as NOT VERIFIED rather than compared against a live state
# nobody observed. Check them by hand after changing this block:
#   gh api repos/Beso1227/Deltempo/branches/main/protection
#   gh api repos/Beso1227/Deltempo --jq '{allow_squash_merge,allow_merge_commit,allow_rebase_merge,delete_branch_on_merge,squash_merge_commit_title,squash_merge_commit_message}'
branches:
  - name: main
    protection:
      required_pull_request_reviews:
        dismiss_stale_reviews: true
        require_code_owner_reviews: true
        required_approving_review_count: 1
      required_status_checks:
        strict: true
        contexts:
          - "Build, Test & Quality Gate"
          - "CodeQL"
      enforce_admins: true
      allow_force_pushes: false
      allow_deletions: false

# Label taxonomy
#
# These EXIST on the live repository today. The previous `type/*`, `priority/*` and
# `status/*` taxonomy declared here did not - not one of those labels had ever been
# created - while the issue templates and dependabot.yml were labelling with the
# GitHub-default names below. Declaring a taxonomy that does not exist is worse than
# declaring none: it makes the file read as governance while contradicting reality.
#
# The section-scoped `area/*` labels are the project's own addition. Everything else
# keeps GitHub's well-known names, because those are what contributors already know
# how to filter by and what GitHub auto-applies in some flows.
#
# If you later adopt a namespaced taxonomy, apply it with the workflow below and
# update the issue templates in the SAME commit - they hardcode label names.
labels:
  # --- GitHub defaults, in use ---
  - name: "bug"
    color: "d73a4a"
    description: "Something isn't working"
  - name: "enhancement"
    color: "a2eeef"
    description: "New feature or request"
  - name: "documentation"
    color: "0075ca"
    description: "Improvements or additions to documentation"
  - name: "question"
    color: "d876e3"
    description: "Further information is requested"
  - name: "invalid"
    color: "e4e669"
    description: "This doesn't seem right"
  - name: "wontfix"
    color: "ffffff"
    description: "This will not be worked on"
  - name: "duplicate"
    color: "cfd3d7"
    description: "This issue or pull request already exists"
  - name: "accessibility"
    color: "f143ab"
    description: "Barrier affecting people with disabilities"
  - name: "good first issue"
    color: "7057ff"
    description: "Good for newcomers and first-time contributors"
  - name: "help wanted"
    color: "008672"
    description: "Extra attention or community contribution needed"

  # --- Automation ---
  - name: "dependencies"
    color: "0366d6"
    description: "Pull requests that update a dependency file"
  - name: ".NET"
    color: "7121c6"
    description: "Pull requests that update .NET code"
  - name: "github_actions"
    color: "000000"
    description: "Pull requests that update GitHub Actions code"

  # --- Area: this project's own taxonomy ---
  # Deliberately not created for every possible area. A label nobody uses is
  # noise; add one when the first PR needs it.
  - name: "area/safety"
    color: "e11d48"
    description: "Safety engine, path protection, protection policy, or destructive-scope changes"
  - name: "area/cleaning"
    color: "f9d0c4"
    description: "Scanner, cache resolvers, and cleanup rules"
  - name: "area/core"
    color: "5319e7"
    description: "Deltempo.Core library and shared engines"
  - name: "area/cli"
    color: "0e8a16"
    description: "deltempo_cli commands and headless automation"
  - name: "area/ui"
    color: "1d76db"
    description: "WPF GUI, views, themes, and interactions"
  - name: "area/ci"
    color: "0366d6"
    description: "GitHub Actions workflows and automation"
  - name: "area/build"
    color: "0eaa8e"
    description: "MSBuild, csproj, packages, and publishing"

# ---------------------------------------------------------------------------
# Known divergences between this file and the live repository
# ---------------------------------------------------------------------------
# These are the differences the project has DELIBERATELY chosen to live with.
# They are listed in machine-readable form as well, because the workflow that
# verifies this file against the live repository has to be able to tell an
# intentional divergence from an accident: a field named here is reported as a
# warning, and anything else that disagrees fails the job.
#
# 1. required_pull_request_reviews is declared above but NOT applied live. See the
#    long note on the branches block.
# 2. "CodeQL" is declared as a required status check but is not one live.
# 3. has_wiki is declared true and IS true live. (It used to be declared false
#    while the live repository had it enabled - a straight contradiction, now fixed.)
# 4. has_discussions is declared false and IS false live. Turning it on is worth
#    considering: usage questions currently have to become issues, which is a poor
#    fit for a project that explicitly invites questions.
# 5. Everything else in this file was reconciled against the live repository on
#    2026-10-22. It previously declared a DIFFERENT description, topic list,
#    has_projects, has_downloads, allow_merge_commit, delete_branch_on_merge and
#    squash-merge title/message than the live repository actually had - because
#    the workflow that was supposed to apply this file had never run once. The
#    declaration now states what is true, so that drift is detectable rather
#    than merely declared.
# ---------------------------------------------------------------------------
known_divergences:
  # Intent, not yet applied. See the branches block for why.
  - main.required_pull_request_reviews
  - main.required_status_checks.contexts
