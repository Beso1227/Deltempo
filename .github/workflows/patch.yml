name: Continuous Patch Release

on:
  push:
    branches:
      - main
    paths:
      - '**.cs'
      - '**.xaml'
      - '**.csproj'
      - '**.sln'
      - 'app.manifest'
      - 'app.ico'
      - 'app_icon.png'
      - 'Cli/**'
      - 'Core/**'
      - 'Models/**'
      - 'Services/**'
      - 'Tests/**'
      - '.github/workflows/patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-patch:
    name: Build & Publish Continuous Patch
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore All Dependencies
        run: |
          dotnet restore WinTempCleaner.csproj
          dotnet restore Cli/Deltempo.Cli.csproj
          dotnet restore Updater/DeltempoUpdater.csproj
          dotnet restore Tests/Deltempo.Tests/Deltempo.Tests.csproj

      - name: Run Verification Tests
        run: dotnet test Tests/Deltempo.Tests/Deltempo.Tests.csproj -c Release --verbosity normal

      - name: Build & Publish Standalone Executables
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          dotnet publish WinTempCleaner.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true "-p:SourceRevisionId=$sha" -o ./dist
          dotnet publish Cli/Deltempo.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true "-p:SourceRevisionId=$sha" -o ./dist
          dotnet publish Updater/DeltempoUpdater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true "-p:SourceRevisionId=$sha" -o ./dist

      - name: Generate Patch Manifest
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $shortSha = (git rev-parse --short HEAD).Trim()
          $msg = (git log -1 --pretty=%B).Trim()
          $date = (Get-Date).ToUniversalTime().ToString("o")
          $guiSize = (Get-Item ./dist/Deltempo.exe).Length
          $guiHash = (Get-FileHash ./dist/Deltempo.exe -Algorithm SHA256).Hash.ToLowerInvariant()

          $manifest = [ordered]@{
              channel = "patch"
              baseVersion = "1.3.3"
              commitSha = $sha
              shortSha = $shortSha
              commitMessage = $msg
              timestamp = $date
              downloadUrl = "https://github.com/Beso1227/Deltempo/releases/download/patch/Deltempo.exe"
              fileSizeBytes = $guiSize
              sha256 = $guiHash
          }

          $json = $manifest | ConvertTo-Json -Depth 4
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("$pwd/dist/patch-manifest.json", $json, $utf8NoBom)

          $lines = @(
              "## ⚡ Deltempo Continuous Patch Build",
              "",
              "Automatically compiled and published on push to ``main``.",
              "",
              "- **Commit**: $sha ($shortSha)",
              "- **Published**: $date",
              "- **SHA-256**: ``$guiHash``",
              "- **Size**: $([math]::Round($guiSize / 1MB, 2)) MB",
              "- **Commit Message**:",
              "> $msg",
              "",
              "<!-- DELTEMPO_PATCH_MANIFEST",
              $json,
              "-->",
              "",
              "### 📦 Standalone Assets",
              "- ``Deltempo.exe`` (Standalone GUI & CLI)",
              "- ``deltempo_cli.exe`` (Headless CLI)",
              "- ``patch-manifest.json`` (Automated patch metadata)"
          )
          [System.IO.File]::WriteAllLines("$pwd/dist/release_notes.md", $lines, $utf8NoBom)

          Write-Host "Generated patch manifest for commit: $shortSha"
          Write-Host $json

      - name: Validate Patch Manifest and Binary Consistency
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $raw = Get-Content ./dist/patch-manifest.json -Raw
          $manifest = ConvertFrom-Json $raw

          # 1. Commit SHA Match
          if ($manifest.commitSha -ne $sha) {
              Write-Error "CI Validation Failed: manifest.commitSha ($($manifest.commitSha)) does not match git HEAD ($sha)"
              exit 1
          }

          # 2. Binary SHA-256 Match
          $actualHash = (Get-FileHash ./dist/Deltempo.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest.sha256.ToLowerInvariant() -ne $actualHash) {
              Write-Error "CI Validation Failed: manifest.sha256 ($($manifest.sha256)) does not match actual executable hash ($actualHash)"
              exit 1
          }

          # 3. File Size Match
          $actualSize = (Get-Item ./dist/Deltempo.exe).Length
          if ($manifest.fileSizeBytes -ne $actualSize) {
              Write-Error "CI Validation Failed: manifest.fileSizeBytes ($($manifest.fileSizeBytes)) does not match actual size ($actualSize)"
              exit 1
          }

          # 4. Channel Match
          if ($manifest.channel -ne "patch") {
              Write-Error "CI Validation Failed: manifest.channel must be 'patch'"
              exit 1
          }

          # 5. PE DOS Header Check
          $bytes = [System.IO.File]::ReadAllBytes("./dist/Deltempo.exe")
          if ($bytes.Length -lt 1024 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
              Write-Error "CI Validation Failed: Deltempo.exe is not a valid PE executable"
              exit 1
          }

          Write-Host "✓ CI Verification Succeeded: Patch manifest and binary are 100% consistent."

      - name: Publish Rolling Patch Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: patch
          name: "Deltempo Continuous Patch (Latest Main)"
          body_path: ./dist/release_notes.md
          files: |
            ./dist/Deltempo.exe
            ./dist/deltempo_cli.exe
            ./dist/DeltempoUpdater.exe
            ./dist/patch-manifest.json
          draft: false
          prerelease: true
