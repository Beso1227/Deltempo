# Nightly soak: the full-strength fuzz campaign that the pull-request gate deliberately
# does not pay for.
#
# PathSecurityFuzzTests.NormalizeCanonicalPath_DeepFuzz_MillionCases runs 1,000,000
# cases against the path canonicalizer. On its own it took roughly 3m34s of a ~4m14s
# local verification run, and because it is the single longest test its total runtime
# swung by several minutes run to run. That made every pull request slow and the numbers
# hard to reason about.
#
# The gate therefore runs Category!=Benchmark&Category!=FuzzDeep, which still includes
# the sibling 100,000-case Fuzz test on every pull request - fuzz coverage is not reduced,
# it is only moved to where its cost is worth paying. This workflow runs the million-case
# campaign nightly, and on demand, so a regression in the canonicalizer still surfaces
# within a day instead of waiting for someone to run it locally.
#
# This job is advisory: it reports, it does not block a pull request.

name: Soak (Deep Fuzz Campaign)

on:
  schedule:
    # 03:17 UTC daily. Off the hour on purpose - the top of the hour is when every other
    # scheduled workflow on GitHub fires, and the queue is measurably slower.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: soak-deep-fuzz
  cancel-in-progress: false

jobs:
  deep-fuzz:
    name: Deep Fuzz (1,000,000 cases)
    runs-on: windows-latest
    # A soak job must never be the reason a push goes red.
    continue-on-error: true

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'

      - name: Restore MSBuild intermediates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            obj
            **/obj
          key: ${{ runner.os }}-msbuild-obj-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-msbuild-obj-

      - name: Build test project
        run: dotnet build tests/Deltempo.Tests/Deltempo.Tests.csproj -c Release

      - name: Run the deep fuzz campaign
        shell: pwsh
        run: |
          $testExe = "tests/Deltempo.Tests/bin/Release/net10.0-windows/Deltempo.Tests.exe"
          if (-not (Test-Path $testExe)) {
            Write-Error "::error::MTP test executable not found at $testExe."
            exit 1
          }

          $sw = [Diagnostics.Stopwatch]::StartNew()
          & $testExe --filter "Category=FuzzDeep" *>&1 |
            Tee-Object -FilePath "deep-fuzz-run.log"
          $sw.Stop()

          Write-Host ("Deep fuzz campaign completed in {0}." -f $sw.Elapsed)

          # The exit code is not the verdict: Microsoft.Testing.Platform force-exits
          # non-zero when foreground threads outlive the run even with every test green.
          #
          # A summary is parsed rather than pattern-matched. The previous check accepted any
          # log containing the literal text 'failed: 0' - which a run that executed ZERO fuzz
          # tests also produces. A renamed or re-trait-ed test would silently stop being
          # fuzzed while the nightly campaign reported success.
          $log = "deep-fuzz-run.log"
          if (-not (Test-Path $log)) {
            Write-Error "::error::No deep-fuzz-run.log was produced - the campaign never started or never reported."
            exit 1
          }

          function Get-FuzzSummaryValue([string]$name) {
            $m = Select-String -Path $log -Pattern "^\s*$name`:\s*(\d+)" | Select-Object -Last 1
            if ($m) { return [int]$m.Matches[0].Groups[1].Value }
            return $null
          }

          $total   = Get-FuzzSummaryValue 'total'
          $failed  = Get-FuzzSummaryValue 'failed'
          $passed  = Get-FuzzSummaryValue 'succeeded'

          if ($null -eq $total -or $null -eq $failed -or $null -eq $passed) {
            Write-Error "::error::The deep fuzz campaign produced no complete summary - it did not run to completion."
            exit 1
          }
          Write-Host ("Deep fuzz summary: total={0} succeeded={1} failed={2}" -f $total, $passed, $failed)

          if ($failed -ne 0) {
            Write-Error "::error::$failed fuzz test(s) failed; see deep-fuzz-run.log."
            exit 1
          }
          if ($total -lt 1) {
            Write-Error "::error::The Category=FuzzDeep filter matched 0 tests. The deep fuzz campaign is not running - check the trait is still applied to PathSecurityFuzzTests.NormalizeCanonicalPath_DeepFuzz_MillionCases."
            exit 1
          }
          if ($passed -ne $total) {
            Write-Error "::error::Deep fuzz summary inconsistent: succeeded != total. The run was truncated."
            exit 1
          }

      - name: Upload campaign log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deep-fuzz-log
          path: deep-fuzz-run.log
          retention-days: 14