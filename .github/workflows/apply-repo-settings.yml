name: Apply Repository Settings

# Makes .github/settings.yml real. Before this workflow existed, that file was a
# declaration that nothing read: its label taxonomy had never been applied, its
# has_wiki value contradicted the live repository, and its branch-protection block
# claimed review requirements that were not in effect. A settings file that is never
# applied is worse than no settings file, because it reads as governance.
#
# WHY THIS FILE IS NOT A THIRD-PARTY ACTION
#
# The previous version called `probdens/settings-action@v1`. That repository does
# not exist. GitHub resolves `owner/repo@ref` at RUN time, so an unresolvable
# reference is not merely broken - it is an unclaimed name. Anyone who registered
# that account and created that repository would have had their code executed
# inside a job whose stated purpose is to rewrite this repository's governance.
# A workflow that mutates branch protection and labels is the last place to
# accept an unpinnable third-party dependency, so this one calls the API
# directly and pins nothing it does not control.
#
# The workflow had never run successfully: `permissions: administration: write` is
# an enterprise-only scope and is rejected on github.com, which made the whole
# file invalid. GitHub reports an invalid workflow as a red run with zero jobs
# and ignores its `paths:` filter, so it failed on every push and was easy to
# mistake for a settings problem rather than a workflow problem.
#
# WHAT THIS CAN AND CANNOT DO
#
# On github.com the GITHUB_TOKEN has no Administration scope, so it CANNOT write
# repository settings or branch protection - only an admin PAT or a GitHub App
# can. What it CAN do is manage labels (the issues scope covers them), so labels
# are applied here and everything else is verified and reported. The live state
# is compared against the declaration on every run, and the job fails loudly when
# they disagree - except for the differences the declaration itself records in
# `known_divergences`, which are the ones this project has deliberately decided
# to live with.

on:
  # Applies automatically when the declaration itself changes, so the two cannot
  # silently drift apart a second time.
  push:
    branches: [ main ]
    paths: [ '.github/settings.yml' ]
  # Manual: re-apply, or preview before committing to a change.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview the changes without applying them'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: apply-repo-settings
  cancel-in-progress: false

jobs:
  apply:
    name: Apply .github/settings.yml
    runs-on: ubuntu-latest

    steps:
      # Validate every workflow file before this one mutates anything. If a
      # workflow file is invalid, this workflow is invalid too, and the right
      # response is to stop rather than to apply a half-understood declaration.
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate workflow files against GitHub's schema
        shell: bash
        run: python3 scripts/validate_workflows.py

      # Labels are the one part of the declaration GITHUB_TOKEN can actually
      # write on github.com, so they are applied here. `gh label create --force`
      # is idempotent: it creates a missing label and updates an existing one,
      # which is exactly the "make the declared state real" behaviour wanted.
      #
      # The condition is explicit about the event rather than relying on
      # `inputs.dry_run` being unset outside workflow_dispatch: on a pull
      # request there is no inputs context at all, and an unset input compares
      # equal to false, which would silently let a pull request rewrite the
      # repository's labels.
      - name: Apply label taxonomy
        if: github.event_name == 'push' || inputs.dry_run == false
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "== Applying labels =="
          python3 - <<'PY' > "$RUNNER_TEMP/labels.tsv"
          import yaml
          with open('.github/settings.yml', encoding='utf-8') as fh:
              settings = yaml.safe_load(fh)
          for label in settings.get('labels', []):
              print('{}|{}|{}'.format(label['name'], label['color'], label.get('description', '')))
          PY
          while IFS='|' read -r name color description; do
            gh label create "$name" --color "$color" --description "$description" --force
          done < "$RUNNER_TEMP/labels.tsv"
          echo "Labels applied."

      # settings-action reports success, but "the action did not error" and "the
      # repository is now in the declared state" are different claims. This step
      # re-reads the repository and fails loudly if they diverge, which is the
      # only way this file stops being aspirational.
      - name: Verify the applied state matches reality
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "== Live repository description =="
          live_desc=$(gh api "repos/$REPO" --jq '.description')
          want_desc=$(grep -A1 '^  description:' .github/settings.yml | tail -1 | sed 's/^ *description: *"//; s/"$//')
          echo "live:  $live_desc"
          echo "want:  $want_desc"

          # GITHUB_TOKEN has no Administration scope on github.com, so this read
          # fails on every run. That is expected, not an error: handle it here so
          # `set -e` does not turn it into an unexplained red job, and never print
          # silence that reads as "there is no protection".
          echo "== Branch protection =="
          if protection=$(gh api "repos/$REPO/branches/main/protection" 2>/dev/null); then
            echo "required status checks:"
            jq -r '.required_status_checks.contexts[]?' <<< "$protection"
            reviews=$(jq -r '.required_pull_request_reviews // "NONE"' <<< "$protection")
            echo "required pull request reviews: $reviews"
            echo "enforce_admins: $(jq -r '.enforce_admins.enabled' <<< "$protection")"
            if [ "$reviews" = "NONE" ]; then
              echo "::warning::main has no required pull-request review. CODEOWNERS is inert - see the note in .github/settings.yml."
            fi
          else
            echo "::notice::Branch protection was NOT read: GITHUB_TOKEN cannot see it (it needs the Administration scope, which workflow tokens do not get on github.com). Protection fields are unverified by this run; check them by hand - see the note in .github/settings.yml."
          fi

          echo "== Labels =="
          gh label list --limit 100

      - name: Compare every declared field against the live repository
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run == false && 'false' || 'true' }}
        run: |
          set -euo pipefail

          gh api "repos/$REPO" > live-repo.json
          # Write `null` when the protection read fails, never `{}`. An empty object
          # is indistinguishable from "this repository has no protection at all",
          # and comparing the declaration against that fabricated state is how this
          # step reported drift that did not exist while hiding the fact that it had
          # checked nothing. `null` reaches the verifier as "unreadable, not
          # compared", and it says so.
          if ! gh api "repos/$REPO/branches/main/protection" > live-protection.json 2>/dev/null; then
            echo 'null' > live-protection.json
          fi
          gh label list --limit 200 --json name,color,description > live-labels.json

          python3 scripts/verify_settings.py

      - name: Fail if declarations could not be applied
        if: failure()
        shell: bash
        run: |
          echo "::error::Applying .github/settings.yml did not complete cleanly. The live repository may now disagree with the declaration - re-read it with: gh api repos/${{ github.repository }}"
          exit 1
