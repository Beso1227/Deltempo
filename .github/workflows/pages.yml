name: Deploy GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  schedule:
    # The README download chart is rendered from the releases API on every
    # deploy, so a daily deploy is what keeps it current. It is published here
    # rather than committed because main requires a green status check: a bot
    # commit would be rejected by branch protection, while a Pages deploy
    # publishes the same file with no commit at all.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Re-render the README download chart from the live releases API before the
      # site is uploaded. The READMEs point at the published URL, so this step is
      # the only thing that makes the chart move between releases.
      - name: Render the download chart
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/generate_downloads_chart.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './docs'
          # Required since v4: hidden files are excluded by default, which would
          # drop docs/.nojekyll and let Jekyll process the published site.
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
