name: Deploy GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  # A published release is exactly when the download numbers jump, so re-render
  # and redeploy immediately rather than waiting for the nightly run.
  release:
    types: [published]
  # A release created by release.yml with GITHUB_TOKEN does NOT emit a `release`
  # event - GitHub suppresses events raised by the workflow token to prevent
  # recursion - so the tag build is picked up by watching that workflow instead.
  workflow_run:
    workflows: ["Build & Release Portable Executable"]
    types: [completed]
  schedule:
    # The README download chart is rendered from the releases API on every
    # deploy, so a daily deploy is what keeps it current between releases. It is
    # published here rather than committed because main requires a green status
    # check: a bot commit would be rejected by branch protection, while a Pages
    # deploy publishes the same file with no commit at all.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run also fires for a failed release build; there is nothing to
    # publish in that case.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Re-render the README download chart and the JSON snapshot from the live
      # releases API before the site is uploaded. The READMEs point at the
      # published SVG; /downloads/ reads the API directly and falls back to the
      # JSON when the API is rate-limited. This step is what keeps both current
      # between releases.
      - name: Render the download chart
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/generate_downloads_chart.js

      # Bring the structured data back in line with the pages before the site is
      # uploaded. The FAQ schema is derived from the questions and answers the
      # page actually shows: it drifted once already, with questions the page
      # no longer had and answers it no longer showed, and a FAQPage that does
      # not match its page is ignored by the search engines it was written for.
      - name: Reconcile the structured data with the pages
        run: node scripts/validate_seo.js --fix

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './docs'
          # Required since v4: hidden files are excluded by default, which would
          # drop docs/.nojekyll and let Jekyll process the published site.
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
