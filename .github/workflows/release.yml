name: Build & Release Portable Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      SIGNING_CERTIFICATE_PFX: ${{ secrets.SIGNING_CERTIFICATE_PFX }}
      SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore All Dependencies
        run: |
          dotnet restore WinTempCleaner.csproj
          dotnet restore Cli/Deltempo.Cli.csproj
          dotnet restore Tests/Deltempo.Tests/Deltempo.Tests.csproj

      - name: Run Tests
        run: dotnet test Tests/Deltempo.Tests/Deltempo.Tests.csproj -c Release --verbosity normal --filter "Category!=Benchmark"

      - name: Build & Publish Standalone Executables
        run: |
          dotnet publish WinTempCleaner.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./dist
          dotnet publish Cli/Deltempo.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./dist

      - name: Authenticode Sign Release Binaries (optional)
        if: env.SIGNING_CERTIFICATE_PFX != ''
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "deltempo_signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Error "::error::signtool.exe not found on the runner."; exit 1 }
          Write-Host "Signing with $($signtool.FullName)"
          & $signtool.FullName sign /f $pfxPath /p "$env:SIGNING_CERTIFICATE_PASSWORD" /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 `
            "$env:GITHUB_WORKSPACE\dist\Deltempo.exe" `
            "$env:GITHUB_WORKSPACE\dist\deltempo_cli.exe"
          if ($LASTEXITCODE -ne 0) { Write-Error "::error::Authenticode signing failed."; exit 1 }
          Remove-Item $pfxPath -Force
          Write-Host "Binaries signed successfully."

      - name: Clean Extra Release Assets
        uses: actions/github-script@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          script: |
            try {
              const tag = context.ref.replace('refs/tags/', '');
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              if (release && release.data && release.data.assets) {
                for (const asset of release.data.assets) {
                  if (asset.name !== 'Deltempo.exe' && asset.name !== 'deltempo_cli.exe') {
                    console.log(`Deleting extra asset: ${asset.name} (id: ${asset.id})`);
                    await github.rest.repos.deleteReleaseAsset({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      asset_id: asset.id
                    });
                  }
                }
              }
            } catch (err) {
              console.log('No prior release to clean:', err.message);
            }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Deltempo ${{ github.ref_name }} — Modular Architecture, Opt-In CLI Integration & Hardened Quality Gates"
          body: |
            ## What's New in ${{ github.ref_name }}

            ### 🧩 Modular Architecture Refactor
            - **13 focused modules** replace the two largest source files: the WPF window core (618 lines + 8 domain partials: Settings, Cleaning, Ui, Updates, Memory, SystemManagers, LargeFiles, SystemRepair) and the CLI dispatcher (276 lines + 4 command partials: Cleaning, Performance, Storage, System). Zero behavioral change.

            ### 🔐 Privacy-Hardened CLI
            - **Shell integration is now strictly opt-in**: the CLI no longer silently modifies your PATH, registry, or PowerShell profiles on every start. New commands: `deltempo register` (install integration), `deltempo register --status` (inspect state), and `deltempo unregister` (remove everything).
            - **Online AI file analysis is off by default.** When enabled, cloud providers receive an anonymized metadata summary only — never file contents. Local providers (Ollama, LM Studio) keep the entire workflow offline.

            ### ✅ Hardened Quality Gates
            - **CI enforces a 60% line-coverage threshold** collected via `dotnet-coverage` (Cobertura).
            - **CodeQL security analysis** (security-extended) runs on every push, pull request, and weekly schedule.
            - **Zero-warning policy**: test project builds with `TreatWarningsAsErrors`.
            - **325/325 xUnit tests passing**; suite runtime cut from 65s to 30s by eliminating blocking-task test patterns.

            ### 📊 Reproducible Performance Benchmark
            - New `scripts/benchmark.ps1` measures parallel deletion throughput on a synthetic sandbox (1,500 files × 8 KB across 50 folders). Measured: **3,385 files/s (26.4 MB/s)** with correctness-only assertions so runs never flake.

            ### 🧰 Community Infrastructure
            - CODEOWNERS, pull-request template with a safety-invariants checklist, structured bug/feature issue templates, and private vulnerability reporting.

            ### ⚡ Carried Forward
            - Parallel cleaning engine (up to 16 threads), NT kernel memory optimization, 26 deep cleaning scopes, AI file forensics, transactional self-updater.
            - Native 64-bit Windows 10 & 11 support on .NET 10.0.
          files: |
            ./dist/Deltempo.exe
            ./dist/deltempo_cli.exe
          draft: false
          prerelease: false

