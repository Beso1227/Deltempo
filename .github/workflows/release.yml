name: Build & Release Portable Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore WinTempCleaner.csproj

      - name: Build & Publish Single-File Portable EXE
        run: |
          dotnet publish WinTempCleaner.csproj -c Release -r win-x64 --self-contained false -o ./dist/portable
          dotnet publish WinTempCleaner.csproj -c Release -r win-x64 --self-contained true -p:EnableCompressionInSingleFile=true -o ./dist/standalone
          Copy-Item ./dist/portable/WinTempCleaner.exe ./dist/Deltempo-Portable.exe
          Copy-Item ./dist/standalone/WinTempCleaner.exe ./dist/Deltempo-Standalone.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./dist/Deltempo-Portable.exe
            ./dist/Deltempo-Standalone.exe
          draft: false
          prerelease: false
          generate_release_notes: true
