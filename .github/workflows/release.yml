name: Build & Release Portable Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore All Dependencies
        run: |
          dotnet restore WinTempCleaner.csproj
          dotnet restore Cli/Deltempo.Cli.csproj
          dotnet restore Tests/Deltempo.Tests/Deltempo.Tests.csproj

      - name: Run Tests
        run: dotnet test Tests/Deltempo.Tests/Deltempo.Tests.csproj -c Release --no-restore

      - name: Build & Publish Standalone Executables
        run: |
          dotnet publish WinTempCleaner.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./dist
          dotnet publish Cli/Deltempo.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./dist

      - name: Clean Extra Release Assets
        uses: actions/github-script@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          script: |
            try {
              const tag = context.ref.replace('refs/tags/', '');
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              if (release && release.data && release.data.assets) {
                for (const asset of release.data.assets) {
                  if (asset.name !== 'Deltempo.exe' && asset.name !== 'deltempo_cli.exe') {
                    console.log(`Deleting extra asset: ${asset.name} (id: ${asset.id})`);
                    await github.rest.repos.deleteReleaseAsset({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      asset_id: asset.id
                    });
                  }
                }
              }
            } catch (err) {
              console.log('No prior release to clean:', err.message);
            }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Deltempo ${{ github.ref_name }} — NT Kernel Memory Cleaner, Large Files & 25 Scopes"
          body: |
            ## What's New in ${{ github.ref_name }}

            ### 🧠 NT Kernel Memory Cleaner (WinMemoryCleaner Integration)
            - **Standby List Purge**: Reclaims cached memory left behind by terminated applications via `NtSetSystemInformation` (SystemMemoryListInformation class 80).
            - **Working Set Flush**: Trims memory across all running processes using `SeProfileSingleProcessPrivilege` and `SeDebugPrivilege`.
            - **System File Cache Reset**: Flushes and resets filesystem working sets with `SetSystemFileCacheSize`.
            - **Modified Page Flush**: Forces dirty memory pages to disk before freeing them from RAM.
            - **Combined Page List**: Deduplicates identical physical memory pages.
            - **Process Immunity Protection**: System-critical processes (`csrss`, `dwm`, `explorer`, `lsass`, `services`, `smss`, `svchost`, Windows Defender) are automatically shielded.

            ### 🔍 Storage Cleanup Across 25 Targets
            - **Windows System**: User temp, system temp, prefetch files, component store temp, font caches, and update delivery caches.
            - **Windows Upgrade Residue**: Cleans `$WINDOWS.~BT`, `$WINDOWS.~WS`, `$WinREAgent\Scratch`, and `ESD` folders (freeing 5–30+ GB post-upgrade).
            - **Device Drivers**: Cleans NVIDIA App OTA installer packages, AMD Software temp folders, and Intel driver extraction caches.
            - **Gaming & Shaders**: Cleans DirectX DXCache, Vulkan GLCache, Intel D3DSCache, Steam stuck downloads, and Epic Games webcache.
            - **Media & Creator Scratch**: Cleans Adobe Premiere/After Effects Media Cache, DaVinci Resolve proxy previews, OBS crash logs, and Blender render caches.
            - **Desktop & Dev Caches**: Cleans Discord, Spotify, Slack, VS Code, and package managers (`npm`, `pip`, `NuGet`, `Cargo`, `Go`).
            - **Browsers**: Full multi-profile cache cleaning for Google Chrome, Microsoft Edge, Brave, Opera, Vivaldi, Arc, and Firefox.

            ### 📦 Large File Hunter & Undo Safety
            - Scans across all drives for files over 50 MB with safety heuristics.
            - Reversible cleanup with Windows Recycle Bin undo support (`SHFileOperation`).
            - Automatic protection for game archives, active binaries, and model weights.

            ### 🚀 Startup Manager
            - Scans Windows Run keys and startup directories with boot impact ratings.
            - Safe and reversible disabling backed up to `Run_Deltempo_Disabled`.

            ### 💻 Synchronous CLI Subsystem
            - Headless terminal tool (`deltempo_cli.exe` and `deltempo`) with dry-run support, JSON formatting, and memory control commands.

            ### ✅ Quality & Reliability
            - **79/79 automated xUnit tests passing**.
            - Built for 64-bit Windows 10 & Windows 11 on .NET 10.0.
          files: |
            ./dist/Deltempo.exe
            ./dist/deltempo_cli.exe
          draft: false
          prerelease: false

