name: Build & Release Portable Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      SIGNING_CERTIFICATE_PFX: ${{ secrets.SIGNING_CERTIFICATE_PFX }}
      SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore All Dependencies
        run: |
          dotnet restore WinTempCleaner.csproj
          dotnet restore Cli/Deltempo.Cli.csproj
          dotnet restore Tests/Deltempo.Tests/Deltempo.Tests.csproj

      - name: Run Tests
        run: dotnet test Tests/Deltempo.Tests/Deltempo.Tests.csproj -c Release --verbosity normal

      - name: Build & Publish Standalone Executables
        run: |
          dotnet publish WinTempCleaner.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./dist
          dotnet publish Cli/Deltempo.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./dist

      - name: Authenticode Sign Release Binaries (optional)
        if: env.SIGNING_CERTIFICATE_PFX != ''
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "deltempo_signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Error "::error::signtool.exe not found on the runner."; exit 1 }
          Write-Host "Signing with $($signtool.FullName)"
          & $signtool.FullName sign /f $pfxPath /p "$env:SIGNING_CERTIFICATE_PASSWORD" /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 `
            "$env:GITHUB_WORKSPACE\dist\Deltempo.exe" `
            "$env:GITHUB_WORKSPACE\dist\deltempo_cli.exe"
          if ($LASTEXITCODE -ne 0) { Write-Error "::error::Authenticode signing failed."; exit 1 }
          Remove-Item $pfxPath -Force
          Write-Host "Binaries signed successfully."

      - name: Clean Extra Release Assets
        uses: actions/github-script@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          script: |
            try {
              const tag = context.ref.replace('refs/tags/', '');
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              if (release && release.data && release.data.assets) {
                for (const asset of release.data.assets) {
                  if (asset.name !== 'Deltempo.exe' && asset.name !== 'deltempo_cli.exe') {
                    console.log(`Deleting extra asset: ${asset.name} (id: ${asset.id})`);
                    await github.rest.repos.deleteReleaseAsset({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      asset_id: asset.id
                    });
                  }
                }
              }
            } catch (err) {
              console.log('No prior release to clean:', err.message);
            }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Deltempo ${{ github.ref_name }} — AI File Safety Intelligence Engine, Multi-Provider LLM Forensics & Deep File Inspection"
          body: |
            ## What's New in ${{ github.ref_name }}

            ### 🧠 Real-Time AI File Safety Intelligence Engine
            - **Multi-Provider LLM Integration**: Analyze unknown or suspicious files with either local offline models (**Ollama**, **LM Studio**) or high-speed cloud inference providers (**OpenRouter**, **Groq**, **DeepSeek**, **OpenAI**, **Anthropic**, **Gemini**, **Perplexity**).
            - **Intelligent Deletion Impact Assessment**: The engine evaluates what the file is, where it originated, whether it is an essential application component or disposable cache, and the concrete consequence if removed.
            - **Granular Safety Scoring**: Produces an objective 0–100 safety score paired with actionable verdicts: `SAFE TO CLEAN`, `REVIEW CAREFULLY`, or `PROTECTED FILE`.

            ### 🔬 Deep File Forensics Analysis Engine
            - **Shannon Entropy Analysis**: Detects packed binaries, encrypted payloads, and high-entropy artifacts.
            - **Binary Header & Magic Byte Validation**: Inspects headers to determine true file type and catch deceptive extensions.
            - **PE Header & Win32 Import Parsing**: Scans executable imports for suspicious behavior, persistence hooks, and unpackers.
            - **Digital Signature Verification**: Checks Authenticode status to distinguish verified publisher software from untrusted binaries.

            ### 📦 Large File Hunter AI Inspection Card
            - **Interactive Visual Inspection**: 1-click AI inspection card right in the desktop interface showing verdict badge, origin analysis, impact assessment, and recommendation.
            - **Safe Large File Filtering**: Quickly isolate files verified safe for disposal without risking program data or user documents.

            ### 💻 Interactive & Headless CLI Enhancements
            - `deltempo large inspect <path>`: Run instant forensic and AI safety evaluations from your terminal.
            - `deltempo large clean --safe-only`: Automate batch cleanup of large files strictly verified safe.

            ### ⚡ High-Speed Parallel Cleaning Engine & NT Kernel Memory Optimizer
            - Bounded parallel file deletion pool (up to 16 threads); throughput is measured and tracked via the reproducible benchmark harness (`scripts/benchmark.ps1`).
            - NT kernel standby list purge, working set trimming, and system file cache reset.
            - 26 deep cleaning scopes covering Windows caches, developer tools, browsers, and game launchers.

            ### ✅ Quality & Reliability
            - **All automated xUnit tests passing** (CI-gated build + test + coverage threshold + CodeQL).
            - Native 64-bit Windows 10 & 11 support on .NET 10.0.
          files: |
            ./dist/Deltempo.exe
            ./dist/deltempo_cli.exe
          draft: false
          prerelease: false

