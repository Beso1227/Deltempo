name: Build & Release Portable Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      SIGNING_CERTIFICATE_PFX: ${{ secrets.SIGNING_CERTIFICATE_PFX }}
      SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore All Dependencies
        run: dotnet restore deltempo.sln

      - name: Run Tests
        run: dotnet test Tests/Deltempo.Tests/Deltempo.Tests.csproj -c Release --verbosity normal --filter "Category!=Benchmark"

      - name: Build & Publish Standalone Executables
        run: |
          dotnet publish WinTempCleaner.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./dist
          dotnet publish Cli/Deltempo.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./dist

      - name: Authenticode Sign Release Binaries (optional)
        if: env.SIGNING_CERTIFICATE_PFX != ''
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "deltempo_signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Error "::error::signtool.exe not found on the runner."; exit 1 }
          Write-Host "Signing with $($signtool.FullName)"
          & $signtool.FullName sign /f $pfxPath /p "$env:SIGNING_CERTIFICATE_PASSWORD" /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 `
            "$env:GITHUB_WORKSPACE\dist\Deltempo.exe" `
            "$env:GITHUB_WORKSPACE\dist\deltempo_cli.exe"
          if ($LASTEXITCODE -ne 0) { Write-Error "::error::Authenticode signing failed."; exit 1 }
          Remove-Item $pfxPath -Force
          Write-Host "Binaries signed successfully."

      - name: Clean Extra Release Assets
        uses: actions/github-script@v9
        if: startsWith(github.ref, 'refs/tags/')
        with:
          script: |
            try {
              const tag = context.ref.replace('refs/tags/', '');
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              if (release && release.data && release.data.assets) {
                for (const asset of release.data.assets) {
                  if (asset.name !== 'Deltempo.exe' && asset.name !== 'deltempo_cli.exe') {
                    console.log(`Deleting extra asset: ${asset.name} (id: ${asset.id})`);
                    await github.rest.repos.deleteReleaseAsset({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      asset_id: asset.id
                    });
                  }
                }
              }
            } catch (err) {
              console.log('No prior release to clean:', err.message);
            }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Deltempo ${{ github.ref_name }}"
          body: |
            ## Deltempo ${{ github.ref_name }}

            Download the standalone Windows executables below. For full details, see the [changelog](https://beso1227.github.io/Deltempo/changelog/).

            ### 📦 Downloads
            - `Deltempo.exe` — Main GUI application (portable, self-contained)
            - `deltempo_cli.exe` — Headless CLI for automation and scripting

            ### ⚙️ Requirements
            - Windows 10 / 11 (64-bit)
            - No .NET runtime required — fully self-contained

            ### 🔒 Verification
            - Reproducible standalone build from tag `${{ github.ref_name }}`
            - 401/401 automated tests passing in CI
          files: |
            ./dist/Deltempo.exe
            ./dist/deltempo_cli.exe
          draft: false
          prerelease: false

