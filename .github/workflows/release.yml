name: Build & Release Portable Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore All Dependencies
        run: |
          dotnet restore WinTempCleaner.csproj
          dotnet restore Cli/Deltempo.Cli.csproj
          dotnet restore Tests/Deltempo.Tests/Deltempo.Tests.csproj

      - name: Run Tests
        run: dotnet test Tests/Deltempo.Tests/Deltempo.Tests.csproj -c Release --no-restore

      - name: Build & Publish Standalone Executable
        run: |
          dotnet publish WinTempCleaner.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./dist

      - name: Clean Extra Release Assets
        uses: actions/github-script@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          script: |
            try {
              const tag = context.ref.replace('refs/tags/', '');
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              if (release && release.data && release.data.assets) {
                for (const asset of release.data.assets) {
                  if (asset.name !== 'Deltempo.exe') {
                    console.log(`Deleting extra asset: ${asset.name} (id: ${asset.id})`);
                    await github.rest.repos.deleteReleaseAsset({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      asset_id: asset.id
                    });
                  }
                }
              }
            } catch (err) {
              console.log('No prior release to clean:', err.message);
            }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Deltempo ${{ github.ref_name }} — Deep Scan Overhaul & UI Redesign"
          body: |
            ## What's New in ${{ github.ref_name }}

            ### ⚡ Unified 100% Standalone Executable
            - **Single File (`Deltempo.exe`)** — Zero runtime dependencies, no separate installer, CLI, or portable builds needed.
            - **Instant Terminal CLI**: Launching the app immediately registers `deltempo` commands globally in PowerShell, Command Prompt, and Win+R (`deltempo scan`, `deltempo clean`, `deltempo boost`, etc.).

            ### 🔍 Deep Scan Engine Overhaul (25+ Cleaning Scopes)
            - Windows Upgrade Leftovers — `$WINDOWS.~BT`, `$WINDOWS.~WS`, `Windows.old` (5–30+ GB after updates)
            - UWP/Windows Store App Caches — LocalCache, AC\INetCache, TempState across all MSIX packages
            - Windows Component & Font Caches — FontCache, WinSxS\Temp, SoftwareDistribution, PeerDist
            - Multi-Profile Browser Cleaning — Chrome, Edge, Brave, Opera, Opera GX, Vivaldi, Arc, Yandex + Firefox/Gecko
            - 25+ total distinct cleaning scopes — surpassing Microsoft PC Manager deep scan

            ### 🎨 UI/UX Architectural Redesign
            - Expanded window to 880x840 for generous macro-whitespace
            - Two-Tier Command Ribbon — category filter pills + selection command bar, no cramped rows
            - 3-Pillar Action Dock — Safety Shield (left), Utility Tools (center), Primary CTA (right)

            ### ✅ Verified
            - 45/45 automated xUnit tests passing
            - 0 build warnings, 0 errors
          files: |
            ./dist/Deltempo.exe
          draft: false
          prerelease: false

