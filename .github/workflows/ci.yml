name: Deltempo Continuous Integration & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Test & Quality Gate
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore deltempo.sln

      - name: Build Solution
        run: dotnet build deltempo.sln -c Release --no-restore

      - name: Verify Code Style & Formatting
        run: dotnet format deltempo.sln --verify-no-changes --no-restore

      - name: Run xUnit Test Suite with Coverage Collection
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-coverage --version 18.*
          dotnet build Tests/Deltempo.Tests/Deltempo.Tests.csproj -c Release --no-restore
          dotnet-coverage collect cmd /c scripts/run_tests_for_coverage.cmd --nologo -f cobertura -o Tests/Deltempo.Tests/TestResults/coverage.cobertura.xml
      - name: Enforce Coverage Threshold
        shell: pwsh
        run: |
          $coverage = Get-ChildItem -Path "Tests/Deltempo.Tests/TestResults" -Recurse -Filter "coverage.cobertura.xml" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $coverage) {
            Write-Error "::error::No coverage report found. Code coverage collection failed."
            exit 1
          }
          [xml]$doc = Get-Content $coverage.FullName
          $lineRate = [double]$doc.coverage.'line-rate'
          $threshold = 0.65
          Write-Host ("Line coverage: {0:P2} (enforced threshold: {1:P0})" -f $lineRate, $threshold)
          if ($lineRate -lt $threshold) {
            Write-Error ("::error::Line coverage {0:P2} is below the enforced threshold {1:P0}." -f $lineRate, $threshold)
            exit 1
          }

      - name: Publish Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: '**/TestResults/*.trx'

