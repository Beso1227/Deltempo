name: Deltempo Continuous Integration & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Test & Quality Gate
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          # Restore was previously uncached, so every run re-downloaded the whole NuGet
          # graph and rebuilt from scratch. CPM puts all versions in Directory.Packages.props,
          # which is what the cache key must be keyed on.
          cache: true
          cache-dependency-path: '**/Directory.Packages.props'

      - name: Restore MSBuild intermediates
        # obj/ holds the generated WPF .g.cs files, the project.assets.json and the NuGet
        # g.props/g.targets. Restoring them lets MSBuild run incrementally instead of
        # re-running the markup compiler and reference resolution on every run.
        uses: actions/cache@v4
        with:
          path: |
            obj
            **/obj
          key: ${{ runner.os }}-msbuild-obj-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-msbuild-obj-

      - name: Restore Dependencies
        run: dotnet restore deltempo.sln

      - name: Build Solution
        run: dotnet build deltempo.sln -c Release --no-restore

      - name: Audit NuGet Packages for Known Vulnerabilities
        shell: pwsh
        run: |
          # Fail CLOSED. Previously this step only string-matched the tool's own output, so
          # three separate conditions silently passed the gate:
          #   a) the audit command itself failed (network/restore error) - output contained no
          #      match, so the step exited 0 with nothing audited;
          #   b) an SDK wording change to the summary line - the match string no longer occurs;
          #   c) vulnerabilities found, but reported only in the non-transitive form.
          # An audit that cannot run must not read as an audit that found nothing.
          $output = dotnet list package --vulnerable --include-transitive 2>&1 | Out-String
          $auditExit = $LASTEXITCODE
          Write-Host $output

          if ($auditExit -ne 0 -and $output -notmatch 'has the following vulnerable packages|has no vulnerable packages') {
            Write-Error "::error::`n$output"
            Write-Error "::error::NuGet vulnerability audit could not complete (exit $auditExit). Treating an unrunnable audit as a failure, not a pass."
            exit 1
          }

          if ($output -match 'has the following vulnerable packages') {
            Write-Error "::error::Vulnerable NuGet packages detected. Update or pin safe versions (see audit output above)."
            exit 1
          }

          if ($output -notmatch 'has no vulnerable packages') {
            Write-Error "::error::`n$output"
            Write-Error "::error::NuGet vulnerability audit produced no verdict line. Refusing to treat an unrecognised audit result as clean."
            exit 1
          }
          Write-Host "NuGet vulnerability audit clean."

      - name: Report Outdated NuGet Packages (read-only)
        # Report-only by design: surfaces available updates in the CI log without failing the
        # build. Uses the built-in `dotnet list package --outdated`, so no extra tool install
        # and no PATH fix-up. Bumps are made deliberately via Directory.Packages.props (CPM).
        shell: pwsh
        run: |
          $output = dotnet list package --outdated --include-transitive | Out-String
          Write-Host $output
          Write-Host "Outdated package report generated (informational only)."

      - name: Report Analyzer Diagnostics (advisory)
        shell: pwsh
        run: |
          # The full CA rule set is intentionally NOT enforced build-wide: a clean rebuild at
          # AnalysisMode=All / latest-all reports ~9,900 diagnostics (3,972 of them CS1591
          # missing-doc comments), which would either fail the build under
          # TreatWarningsAsErrors or drown out real findings.
          #
          # This step is therefore a trend report. It fails only on the small set of rules
          # that indicate genuine defects rather than style/doc preferences - those must
          # stay at zero.
          $build = dotnet build deltempo.sln -c Release --no-restore `
            /p:AnalysisMode=All /p:AnalysisLevel=latest-all /p:GenerateDocumentationFile=true `
            /p:TreatWarningsAsErrors=false 2>&1 | Out-String

          $all = [regex]::Matches($build, ': warning ([A-Z]+)(\d+):')
          Write-Host ("Total analyzer diagnostics (advisory): {0}" -f $all.Count)

          # Count EVERY rule, not just the reported top 12. The previous version filtered
          # $top (already truncated to 12 rows), so a blocking rule with a handful of hits
          # could fall off the end of the list and the gate would report success.
          $byRule = @{}
          foreach ($m in $all) {
            $name = $m.Groups[1].Value + $m.Groups[2].Value
            if ($byRule.ContainsKey($name)) { $byRule[$name]++ } else { $byRule[$name] = 1 }
          }

          Write-Host "Top rules:"
          foreach ($rule in ($byRule.GetEnumerator() | Sort-Object Value -Descending | Select-Object -First 12)) {
            Write-Host ("  {0,-8} {1}" -f $rule.Value, $rule.Key)
          }

          # CA5350/CA5351 (weak crypto) and CA2201 (reserved exception type) indicate real
          # security or correctness bugs, and are genuinely at zero today. CA1062/CA1816/
          # CA2016 do fire in this codebase but are dominated by style-level noise, so they
          # are reported rather than gated until their families are cleaned up.
          $blocking = @('CA5350','CA5351','CA2201')
          $hits = $blocking | Where-Object { $byRule.ContainsKey($_) }
          if ($hits) {
            foreach ($hit in $hits) { Write-Host "::error file=Directory.Build.props::Blocking analyzer rule $hit reported $($byRule[$hit]) occurrence(s)." }
            Write-Error "::error::Analyzer rules that indicate real security/correctness defects must stay at zero."
            exit 1
          }
          Write-Host "No defect-indicating analyzer rules reported."

      - name: Verify Code Style & Formatting
        run: dotnet format deltempo.sln --verify-no-changes --no-restore

      - name: Run xUnit v3 Test Suite with Coverage Collection
        shell: pwsh
        run: |
          # xunit.v3 runs on Microsoft.Testing.Platform (MTP). On the .NET 10 SDK the VSTest
          # bridge is rejected outright ("Testing with VSTest target is no longer supported"),
          # so `dotnet test` cannot be used here - the test application is invoked directly.
          # --coverage comes from Microsoft.Testing.Extensions.CodeCoverage and replaces the
          # VSTest-only --collect:"XPlat Code Coverage" flag.
          dotnet build tests/Deltempo.Tests/Deltempo.Tests.csproj -c Release --no-restore

          # Clear any previous TestResults first. The coverage gate below selects the newest
          # *.cobertura.xml by timestamp, so a report left over from an earlier run could be
          # picked up when collection fails on this run - letting the gate pass on stale data.
          if (Test-Path "tests/Deltempo.Tests/TestResults") {
            Remove-Item -Recurse -Force "tests/Deltempo.Tests/TestResults"
          }
          New-Item -ItemType Directory -Force -Path "tests/Deltempo.Tests/TestResults" | Out-Null

          $testExe = "tests/Deltempo.Tests/bin/Release/net10.0-windows/Deltempo.Tests.exe"
          if (-not (Test-Path $testExe)) {
            Write-Error "::error::MTP test executable not found at $testExe."
            exit 1
          }

          # Test output is captured to a log file for the artifact upload. The optional
          # xunit TRX/JUnit reporters are NOT auto-registered by MTP without a
          # *.testingplatformextensions.json manifest, so they silently produce no file;
          # the console log plus the exit code are the reliable signals here.
          #
          # FuzzDeep is the 1,000,000-case canonicalizer campaign. On its own it accounted
          # for ~3m34s of a ~4m14s run and its runtime swung by minutes, which made the
          # gate both slow and unpredictable. It still runs on every PR at 100,000 cases via
          # the sibling Fuzz trait; the full-strength campaign runs nightly in soak.yml.
          # Neither is ever merely skipped. The filter must stay on this single line:
          # PowerShell cannot parse a comment inside a backtick line-continuation.
          & $testExe `
            --filter "Category!=Benchmark&Category!=FuzzDeep" `
            --coverage `
            --coverage-output-format cobertura `
            --results-directory tests/Deltempo.Tests/TestResults `
            *>&1 | Tee-Object -FilePath "tests/Deltempo.Tests/TestResults/test-run.log"
          $testExit = $LASTEXITCODE

          # The result summary is the verdict - NOT the process exit code.
          # Microsoft.Testing.Platform force-exits non-zero when foreground threads outlive
          # the run ("[FATAL ERROR] Foreground threads were left running"), even with every
          # test green. So the summary is parsed and asserted directly.
          #
          # The previous check was `-match 'succeeded: 9\d\d|succeeded: \d+'`, which any digit
          # count satisfies - including a run that aborted mid-suite and still printed a
          # summary for the handful of tests it had completed. A truncated run read as green.
          $log = "tests/Deltempo.Tests/TestResults/test-run.log"
          if (-not (Test-Path $log)) {
            Write-Error "::error::No test-run.log was produced - the suite never started or never reported."
            exit 1
          }

          $summary = Select-String -Path $log -Pattern '^\s*total:\s*(\d+)' | Select-Object -Last 1
          if (-not $summary) {
            Write-Error "::error::No test summary found in test-run.log - the run did not complete."
            exit 1
          }

          function Get-SummaryValue([string]$name) {
            $m = Select-String -Path $log -Pattern "^\s*$name`:\s*(\d+)" | Select-Object -Last 1
            if ($m) { return [int]$m.Matches[0].Groups[1].Value }
            return $null
          }

          $total     = Get-SummaryValue 'total'
          $failed    = Get-SummaryValue 'failed'
          $succeeded = Get-SummaryValue 'succeeded'
          $skipped   = Get-SummaryValue 'skipped'

          Write-Host ("Test summary: total={0} succeeded={1} failed={2} skipped={3}" -f $total, $succeeded, $failed, $skipped)

          if ($null -eq $failed -or $null -eq $succeeded -or $null -eq $total) {
            Write-Error "::error::Test summary is incomplete (total/succeeded/failed not all reported) - the run did not complete."
            exit 1
          }
          if ($failed -ne 0) {
            Write-Error "::error::$failed test(s) failed; see test-run.log."
            exit 1
          }
          if ($total -le 0) {
            Write-Error "::error::Test run reported 0 total tests. An empty selection is not a passing suite."
            exit 1
          }
          if ($succeeded -ne $total - $skipped) {
            Write-Error "::error::Test summary is internally inconsistent: succeeded + skipped != total. The run was truncated."
            exit 1
          }

          # Truncation tripwire. A suite this size is well into four figures; a run that
          # collapses to hundreds means tests were silently filtered out or the host died
          # partway. This is a deliberately loose floor - it is not a test-count assertion
          # (DocumentationConsistencyTests owns exact count reconciliation) - it exists only
          # to catch a short run that would otherwise self-report as green.
          $truncationFloor = 900
          if ($total -lt $truncationFloor) {
            Write-Error "::error::Only $total tests ran, below the truncation floor of $truncationFloor. The suite did not run to completion."
            exit 1
          }

          if ($testExit -ne 0) {
            Write-Warning "::warning::Test host exited with code $testExit after reporting every test passed (lingering foreground thread at shutdown). Treating as a pass."
          }
          Write-Host "Test suite completed successfully."

      - name: Enforce Core Coverage Threshold
        shell: pwsh
        run: |
          $reports = Get-ChildItem -Path "tests/Deltempo.Tests/TestResults" -Recurse -Filter "*.cobertura.xml" |
            Sort-Object LastWriteTime -Descending
          if (-not $reports) {
            Write-Error "::error::No coverage report found. Code coverage collection failed."
            exit 1
          }
          $coverage = $reports | Select-Object -First 1

          # Gate Core/ only, as intended: the safety, cleaning, update and scanning
          # pipelines. The WPF UI head is excluded because a headless CI run cannot
          # exercise views, and dragging it in would make the number meaningless.
          #
          # XPath rather than [xml] property access: the report repeats <class> nodes many
          # times and PowerShell silently collapses them into a single node, which yields a
          # bogus 0% (measured - see docs/TESTING.md).
          $x = New-Object System.Xml.XPath.XPathDocument($coverage.FullName)
          $nav = $x.CreateNavigator()
          $classes = $nav.Select('//class')

          $totalLines = 0
          $coveredLines = 0
          foreach ($class in $classes) {
            $name = $class.GetAttribute('name', '')
            if ($name -notlike 'WinTempCleaner.Core*') { continue }
            foreach ($line in $class.Select('./lines/line')) {
              $totalLines++
              if ([int]$line.GetAttribute('hits', '') -gt 0) { $coveredLines++ }
            }
          }

          if ($totalLines -eq 0) {
            Write-Error "::error::Coverage report contained no WinTempCleaner.Core* classes - the gate cannot be evaluated."
            exit 1
          }

          $lineRate = $coveredLines / $totalLines
          $threshold = 0.65

          # Overall figure is printed for trend visibility but is NOT gated.
          $overall = [double]$nav.SelectSingleNode('/coverage').GetAttribute('line-rate', '')
          Write-Host ("Core/ line coverage:      {0:P2} ({1}/{2}) - enforced threshold {3:P0}" -f $lineRate, $coveredLines, $totalLines, $threshold)
          Write-Host ("Whole-solution coverage:  {0:P2} (informational)" -f $overall)

          if ($lineRate -lt $threshold) {
            Write-Error ("::error::Core/ line coverage {0:P2} is below the enforced threshold {1:P0}." -f $lineRate, $threshold)
            exit 1
          }
          Write-Host "Core/ coverage gate passed."

      - name: Generate Software Bill of Materials (SBOM) Package Inventory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          dotnet list deltempo.sln package --include-transitive --format json | Out-File -FilePath "artifacts/sbom-packages.json" -Encoding utf8
          Write-Host "SBOM package inventory generated at artifacts/sbom-packages.json"

      - name: Publish SBOM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SBOM-Inventory
          path: artifacts/sbom-packages.json

      - name: Publish Test Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: |
            **/TestResults/*.log
            **/TestResults/**/*.xml
            **/TestResults/**/*.dmp
