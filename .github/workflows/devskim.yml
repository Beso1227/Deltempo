# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: DevSkim

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '22 13 * * 0'

jobs:
  lint:
    name: DevSkim
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run DevSkim scanner
        uses: microsoft/DevSkim-Action@734c6ed89671b1c7a5211ed334c79db261e3f221 # v1
        with:
          # The committed .ua/ knowledge graph is generated output: its JSON files
          # store per-file SHA-256 fingerprints and the analyzed commit hash, which
          # DS173237 reads as "token or key in source". They hold no credentials,
          # and the graph is rebuilt by the /understand skill, so the JSON is
          # skipped while .ua/ua-query.mjs (real code) stays in the scan.
          ignore-globs: "**/.git/**,**/bin/**,**/obj/**,**/scripts/vendor/**,**/docs/vendor/**,**/.ua/fingerprints.json,**/.ua/knowledge-graph.json,**/.ua/meta.json"
          # -E makes devskim's exit code the NUMBER OF ISSUES the severity filter
          # admits, and the action's entrypoint passes that exit code straight
          # through to the step. Without it the scan always exits 0 and the check
          # is decorative: the "DevSkim" status stayed green on main while 7
          # alerts sat open in the Security tab, because nothing was ever going
          # to fail the build on a finding.
          #
          # One invisible property of devskim 1.0.90 explains the red step:
          # its DEFAULT severity filter is "Critical Important Moderate
          # BestPractice ManualReview" - the assumed Critical/Important/
          # Moderate list never applied, so every ManualReview note on the
          # tree (3x DS162092 http://localhost literals in
          # SettingsWorkspaceViewModel.cs, 2x DS172411 setTimeout inside the
          # vendored minified lenis.min.js) counted toward the exit. The
          # vendored minified third-party library also should never be scanned
          # at all; it moved to ignore-globs.
          #
          # Reproduced the entrypoint's exact argv against a detached-HEAD
          # checkout: exit 5 with the default filter (those same 5 findings),
          # exit 0 with "-E -s Critical,Important,Moderate" - which is what
          # extra-options now passes, so the gate fires only on real code
          # findings, not ManualReview notices; those still reach the uploaded
          # results without blocking the build.
          #
          # The 7 suppressed test-fixture findings in
          # UpdatePipelineSecurityTests.cs reproduce without their same-line
          # "// DevSkim: ignore DS<id>" comments when the suppression comments
          # removed (verified against this action's pinned CLI version 1.0.90).
          extra-options: "-E -s Critical,Important,Moderate"

      - name: Upload DevSkim scan results to GitHub Security tab
        if: hashFiles('devskim-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: devskim-results.sarif
