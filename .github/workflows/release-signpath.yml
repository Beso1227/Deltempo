name: Build & Release Portable Executable (SignPath)

# Alternative release pipeline for projects that obtain free code signing
# through the SignPath Foundation open-source program.
#
# Use THIS workflow instead of release.yml once your SignPath account is active.
# It builds, signs with your SignPath identity, verifies the signature, and
# publishes the release assets.
#
# Required repository secrets:
#   SIGNPATH_TOKEN       SignPath API token
#   SIGNPATH_ORG_ID      Organisation id
#   SIGNPATH_PROJECT_ID  Certificate-configuration project id
#
# Optional:
#   SIGNPATH_CERT_PROFILE_ID  Certificate profile, when using custom profiles

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and upload assets for (e.g. v3.0.0). Must already exist on GitHub.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    name: Build, SignPath-Sign & Upload

    steps:
      - name: Resolve Tag
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          echo "value=$tag" >> $env:GITHUB_OUTPUT

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.value }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate Version Matches Tag
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.value }}"
          $tagVersion = $tag.TrimStart('v')
          [xml]$props = Get-Content "Directory.Build.props"
          $tagShort = ($tagVersion -split '\.')[0..2] -join '.'
          $asmShort = (($props.Project.PropertyGroup.AssemblyVersion) -split '\.')[0..2] -join '.'
          if ($tagShort -ne $asmShort) {
            Write-Error "::error::Version mismatch! Tag '$tagShort' != AssemblyVersion '$asmShort'."
            exit 1
          }
          Write-Host "Version validated: $tagShort"

      - name: Restore All Dependencies
        run: dotnet restore deltempo.sln

      - name: Run Tests
        run: dotnet test Tests/Deltempo.Tests/Deltempo.Tests.csproj -c Release --no-restore --filter "Category!=Benchmark"

      - name: Build & Publish Standalone Executables
        run: |
          dotnet publish WinTempCleaner.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./dist
          dotnet publish Cli/Deltempo.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./dist

      - name: Sign with SignPath
        uses: signpath/action@v1
        with:
          organizationId: ${{ secrets.SIGNPATH_ORG_ID }}
          projectId: ${{ secrets.SIGNPATH_PROJECT_ID }}
          apiToken: ${{ secrets.SIGNPATH_TOKEN }}
          certProfileId: ${{ secrets.SIGNPATH_CERT_PROFILE_ID }}
          artifactConfigurationId: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_ID || '00000000-0000-0000-0000-000000000000' }}
          files: |
            ./dist/*.exe

      - name: Verify Signatures
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Error "::error::signtool.exe not found."; exit 1 }

          foreach ($binary in @("Deltempo.exe", "deltempo_cli.exe")) {
            & $signtool.FullName verify /pa (Join-Path $env:GITHUB_WORKSPACE "dist\$binary")
            if ($LASTEXITCODE -ne 0) { Write-Error "::error::Signature verification failed for $binary."; exit 1 }
            Write-Host "Verified: $binary"
          }

      - name: Generate SHA-256 Checksums
        shell: pwsh
        run: |
          $lines = @()
          foreach ($f in @("./dist/Deltempo.exe", "./dist/deltempo_cli.exe")) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            $name = [System.IO.Path]::GetFileName($f)
            $lines += "$hash  $name"
            Write-Host "$hash  $name"
          }
          $lines | Out-File -FilePath "./dist/checksums.sha256" -Encoding utf8 -NoNewline

      - name: Publish Signed Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: "Deltempo ${{ steps.tag.outputs.value }}"
          body: |
            ## Deltempo ${{ steps.tag.outputs.value }}

            Signed and checksummed portable builds for Windows 10/11 (64-bit).

            | File | Description |
            |------|-------------|
            | `Deltempo.exe` | GUI application - portable, self-contained |
            | `deltempo_cli.exe` | Headless CLI for automation |
            | `checksums.sha256` | SHA-256 verification hashes |

            Verify your download:
            ```powershell
            Get-FileHash .\Deltempo.exe -Algorithm SHA256
            ```
          files: |
            ./dist/Deltempo.exe
            ./dist/deltempo_cli.exe
            ./dist/checksums.sha256
          draft: false
          prerelease: false
