name: Build & Release Portable Executable (SignPath)

# Release pipeline for projects signing through SignPath.
#
# Prerequisite (do once, in the SignPath dashboard):
#   1. Create an Artifact Configuration whose root is a <zip-file>.
#   2. Create a Signing Policy, and note both slugs.
#   3. Add a Trusted Build System for GitHub.com, and install the SignPath
#      GitHub App with access to this repository.
#
# Repository secrets:
#   SIGNPATH_API_TOKEN         SignPath REST API token
#   SIGNPATH_ORGANIZATION_ID  Organisation id
#   SIGNPATH_PROJECT_SLUG     Project slug
#   SIGNPATH_SIGNING_POLICY   Signing policy slug
#   SIGNPATH_ARTIFACT_CONFIG  Artifact configuration slug (optional)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and sign (e.g. v3.0.0). Must already exist on GitHub.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    name: Build, SignPath-Sign & Upload

    steps:
      - name: Resolve Tag
        id: tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event_inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          Write-Host "Building release for tag: $tag"
          echo "value=$tag" >> $env:GITHUB_OUTPUT

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.value }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate Version Matches Tag
        shell: pwsh
        run: |
          $tagVersion = "${{ steps.tag.outputs.value }}".TrimStart('v')
          [xml]$props = Get-Content "Directory.Build.props"
          $tagShort = ($tagVersion -split '\.')[0..2] -join '.'
          $asmShort = (($props.Project.PropertyGroup.AssemblyVersion) -split '\.')[0..2] -join '.'
          if ($tagShort -ne $asmShort) {
            Write-Error "::error::Version mismatch! Tag '$tagShort' != AssemblyVersion '$asmShort'."
            exit 1
          }
          Write-Host "Version validated: $tagShort"

      - name: Restore All Dependencies
        run: dotnet restore deltempo.sln

      - name: Run Tests
        run: dotnet test Tests/Deltempo.Tests/Deltempo.Tests.csproj -c Release --no-restore --filter "Category!=Benchmark"

      - name: Build Standalone Executables
        run: |
          dotnet publish WinTempCleaner.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./dist
          dotnet publish Cli/Deltempo.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o ./dist
          Get-ChildItem ./dist | Select-Object Name, Length | Format-Table

      # SignPath signs artifacts stored as GitHub Actions artifacts, so the
      # unsigned build must be uploaded before the signing request is submitted.
      - name: Upload Unsigned Artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: deltempo-unsigned
          path: ./dist
          retention-days: 1

      - name: Submit SignPath Signing Request
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY }}
          artifact-configuration-slug: ${{ secrets.SIGNPATH_ARTIFACT_CONFIG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          output-artifact-directory: ${{ github.workspace }}/signed

      - name: Verify Signatures
        shell: pwsh
        run: |
          $signedDir = Join-Path $env:GITHUB_WORKSPACE "signed"
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "release"
          New-Item -ItemType Directory -Force -Path $publishDir | Out-Null

          # Copy the signed binaries out and verify each one before publishing.
          $lines = @()
          foreach ($binary in @("Deltempo.exe", "deltempo_cli.exe")) {
            $src = Get-ChildItem -Path $signedDir -Recurse -Filter $binary | Select-Object -First 1
            if (-not $src) { Write-Error "::error::Signed $binary not found in $signedDir"; exit 1 }

            $dst = Join-Path $publishDir $binary
            Copy-Item $src.FullName -Destination $dst -Force

            $sig = Get-AuthenticodeSignature $dst
            if ($sig.Status -ne 'Valid') {
              Write-Error "::error::$binary signature is '$($sig.Status)', expected 'Valid'."
              exit 1
            }
            Write-Host "Verified $binary -> $($sig.SignerCertificate.Subject)"

            $hash = (Get-FileHash $dst -Algorithm SHA256).Hash.ToLower()
            $lines += "$hash  $binary"
            Write-Host "$hash  $binary"
          }

          $lines | Out-File -FilePath (Join-Path $publishDir "checksums.sha256") -Encoding utf8 -NoNewline

      - name: Publish Signed Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: "Deltempo ${{ steps.tag.outputs.value }}"
          body: |
            ## Deltempo ${{ steps.tag.outputs.value }}

            Authenticode-signed, checksummed portable builds for Windows 10/11 (64-bit).

            | File | Description |
            |------|-------------|
            | `Deltempo.exe` | GUI application - portable, self-contained |
            | `deltempo_cli.exe` | Headless CLI for automation |
            | `checksums.sha256` | SHA-256 verification hashes |

            Verify the publisher and the download:
            ```powershell
            Get-AuthenticodeSignature .\Deltempo.exe | Format-List
            Get-FileHash .\Deltempo.exe -Algorithm SHA256
            ```
          files: |
            ./release/Deltempo.exe
            ./release/deltempo_cli.exe
            ./release/checksums.sha256
          draft: false
          prerelease: false

